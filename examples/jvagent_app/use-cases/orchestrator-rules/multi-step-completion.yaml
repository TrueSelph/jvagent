schema: jvagent.use-case/v1
id: rules.multi-step-completion
title: A two-part request is completed in one turn, not half-done
priority: P0
tags: [orchestrator-rules, live, loop-protocol]
traceability:
  docs:
    - docs/ORCHESTRATOR.md
given:
  channel: web
  new_user: false
turns:
  # "Finish multi-step tasks before replying" was merged into the act-don't-
  # announce bullet. A model that has lost it does the first half and reports
  # progress, which reads as success and is not.
  - id: research-and-save
    when:
      user: "Look up who currently leads the EU AI Act implementation and save a short summary to eu-ai-act.md"
    then:
      loop:
        must_not_announce: true
        min_substantive_tools: 2
