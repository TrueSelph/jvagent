<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jvmessenger — scratch host page</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 48px;
             background: #f4f5f8; color: #1f2333; }
      .box { max-width: 640px; margin: 0 auto; }
      code { background: #e6e8ef; padding: 2px 6px; border-radius: 6px; word-break: break-all; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Fake customer site</h1>
      <p>
        Manual E2E for the embeddable messenger. Prefer the bundled demo at
        <code>http://127.0.0.1:3100/</code> (served by <code>jvagent messenger</code>).
        This file is for cross-origin checks — serve it from a <em>different</em>
        port than the messenger.
      </p>
    </div>

    <script
      src="http://127.0.0.1:3100/loader.js?agentId=n.Agent.19357983a24a4ae59389e480&agentUrl=http://127.0.0.1:8000"
      data-theme="auto"
      data-title="Orchestrator Agent"
      data-greeting="Hi! How can I help you today?"
      data-quick-replies='["What can you do?","Help me get started"]'
      data-show-reasoning="false"
      data-attachments="true"
      data-voice="false"
      data-fullscreen="true"
    ></script>
  </body>
</html>
