name: Test jvagent

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Install jvagent package with test dependencies
        # Explicitly qualify transports awaiting retirement. The general test
        # extra must also install with the native provider SDK, so LiteLLM is
        # selected only here. Both profiles use the same Pydantic core version.
        run: python -m pip install -e '.[test,pydantic-pilot,litellm]'

      - name: Verify transitional dependency consistency
        run: python -m pip check

      - name: Record jvspatial version (integration smoke)
        run: python -c "import importlib.metadata as m; print('jvspatial', m.version('jvspatial'))"

      - name: Validate example app YAML
        run: python -m jvagent.cli validate examples/jvagent_app

      - name: Run tests
        run: pytest tests/ -v --tb=short

      # Orchestrator prompt cost is easy to regress and invisible in a diff: any
      # edit to the prompt template, tool surfacing, or observation replay
      # changes what every tick resends. Token counts here are deterministic
      # (the model call is intercepted, so no API key and no network), which
      # makes this a real gate rather than a flaky threshold. Budgets carry
      # headroom over the measured baseline — they catch a structural
      # regression, not normal drift.
      - name: Check orchestrator prompt budget
        run: |
          python scripts/bench_orchestrator.py examples/jvagent_app \
            --assert-max-tokens 11000 \
            --assert-min-cache-pct 90

      - name: Run pre-commit checks
        run: |
          pip install pre-commit
          pre-commit run --all-files

  native-harness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
          POSTGRES_DB: jvagent_native_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jvagent_native_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYDANTIC_AI_NO_BANNER: '1'
      JVAGENT_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/jvagent_native_test  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install native harness and test dependencies
        # Prove the general test and native dependency profiles resolve together.
        run: python -m pip install -e '.[test,native-harness,native-mcp,pydantic-pilot]' 'jvspatial[postgres]==0.1.1'
      - name: Install declared read-tool profile dependencies
        # Exercise this Action without adding its dependencies to harness core
        # or installing the full PageIndex manifest's legacy model transport.
        run: |
          python - <<'PYTHON'
          import subprocess
          import sys
          import yaml
          requirements = []
          for path in ('jvagent/action/pageindex_read/info.yaml', 'jvagent/action/web_fetch/info.yaml'):
              with open(path) as source:
                  requirements.extend(yaml.safe_load(source)['package']['dependencies']['pip'])
          subprocess.run([sys.executable, '-m', 'pip', 'install', *requirements], check=True)
          PYTHON
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Full suite with native execution and graph adapters
        # Optional LiteLLM transports are qualified in the explicit legacy job;
        # all remaining tests now run against the supported native SDK pair.
        run: pytest tests/ -q --tb=short

  harness-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test,pydantic-pilot,litellm]'
      - name: Conformance lane
        run: pytest tests/conformance tests/harness -m harness_conformance -q --tb=short

  harness-two-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test,pydantic-pilot,litellm]'
      - name: Two-worker / crash-recovery lane
        run: pytest tests/conformance/test_leases.py tests/conformance/test_invocation_recovery.py -q --tb=short

  harness-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test,pydantic-pilot,litellm]'
      - name: Skill isolation lane
        run: pytest tests/ -m harness_isolation -q --tb=short

  harness-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test,pydantic-pilot,litellm]'
      - name: Load lane
        run: pytest tests/ -m harness_load -q --tb=short

  jvchat:
    runs-on: ubuntu-latest
    # A registry stall in `npm ci` once held this job for the 45-minute default
    # and failed the run for a tree that had passed minutes earlier; bound it.
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: jvchat/package-lock.json

      - name: Install jvchat dependencies
        working-directory: jvchat
        timeout-minutes: 8
        run: npm ci || (echo "::warning::npm ci failed once; retrying" && sleep 20 && npm ci)

      - name: Lint jvchat
        working-directory: jvchat
        run: npm run lint

      - name: Test jvchat
        working-directory: jvchat
        run: npm test

      - name: Build jvchat
        working-directory: jvchat
        run: npm run build
