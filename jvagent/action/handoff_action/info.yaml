package:
  name: jvagent/handoff_action
  author: Tharick Jairam
  archetype: HandoffAction
  version: 1.0.0
  meta:
    title: Handoff Action
    description: >-
      One handoff mode at a time. consult asks staff and replies when they
      answer (handoff__consult, handoff__pending_questions,
      handoff__save_answer, handoff__update_chunk). transfer leaves the
      conversation (handoff__transfer). observe stores WhatsApp group facts
      in PageIndex and adds group numbers to AccessControl, without replying
      (handoff__observe). Pin the active mode's tools on the orchestrator.
    group: jvagent
    type: action
  config:
    order:
      weight: 0
  dependencies:
    jvagent: ~0.1.7
    actions: []
    pip: []
