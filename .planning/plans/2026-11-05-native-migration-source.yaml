agent: jvagent/migration
context:
  alias: Migrated Native Harness
  name: Migrated Native Harness
  role: A concise assistant using modular read integrations
  enabled: true
  interaction_limit: 30
actions:
- action: jvagent/orchestrator
  context:
    enabled: true
    model: gpt-4.1
    model_action_type: OpenAILanguageModelAction
    model_temperature: 0.0
    model_max_tokens: 8192
    activation_budget: 20
    max_duration_seconds: 180
    max_turn_cost_usd: '2.00'
    max_conversation_cost_usd: '20.00'
    system_prompt_extra: Answer concisely using the selected skill and successful
      tool results. Never invent completed work.
- action: jvagent/openai_lm
  context:
    enabled: true
    api_key: ${OPENAI_API_KEY}
    max_retries: 0
- action: jvagent/mcp
  context:
    enabled: true
    sandbox_mode: false
    native_read_tools:
    - mcp_records__lookup_record
    servers:
    - name: records
      transport: stdio
      command: /private/tmp/jvagent-unified-test-311/bin/python
      args:
      - /Users/eldonmarks/Briefcase/dev/jv/jvagent/tests/harness/native/mcp_fixture.py
      env:
        JV_MCP_FIXTURE_AUDIT: /private/tmp/jvagent-native-migration-smoke/calls.txt
        JV_MCP_FIXTURE_PID: /private/tmp/jvagent-native-migration-smoke/server.pid
- action: jvagent/reply
  context:
    enabled: true
